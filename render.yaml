# Blueprint de Render: describe cómo desplegar la API de StockFlow.
# En Render: New → Blueprint → elegir este repositorio.
services:
  - type: web
    name: stockflow-api
    runtime: node
    plan: free
    # Virginia = misma zona que la base de datos en Neon (us-east-1): consultas de ~1 ms
    region: virginia
    rootDir: server
    # --include=dev: TypeScript y Prisma CLI son devDependencies y se necesitan para compilar.
    # migrate deploy aplica las migraciones pendientes (no borra datos ni crea migraciones nuevas).
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # se escribe a mano en Render (es secreta)
      - key: CORS_ORIGIN
        sync: false # URL del frontend en Vercel
      - key: ADMIN_EMAIL
        sync: false # único correo que puede crear el primer administrador
      - key: LOG_SQL
        value: "false"
      - key: PRISMA_HIDE_UPDATE_MESSAGE
        value: "true"
